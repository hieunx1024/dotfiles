# Portal cho sway (XDG_CURRENT_DESKTOP=sway:wlroots), ghi đè /usr/share/xdg-desktop-portal/sway-portals.conf.
# Bản hệ thống chỉ có default=wlr;gtk. Interface nào wlr/gtk không có (GlobalShortcuts) thì
# xdg-desktop-portal tự chọn theo key UseIn cũ -> kéo xdg-desktop-portal-hyprland lên trong sway
# (journal: "Choosing hyprland.portal for ...GlobalShortcuts via the deprecated UseIn key").
# Ghi rõ "none" để sway không bao giờ dùng thành phần của Hyprland.
[preferred]
default=wlr;gtk;
org.freedesktop.impl.portal.GlobalShortcuts=none
