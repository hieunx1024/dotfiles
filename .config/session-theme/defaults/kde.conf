# Giao diện mặc định của phiên KDE: Breeze Dark cho các app GTK
org.gnome.desktop.interface gtk-theme 'Breeze-Dark'
org.gnome.desktop.interface icon-theme 'breeze-dark'
org.gnome.desktop.interface cursor-theme 'breeze_cursors'
org.gnome.desktop.interface cursor-size 24
org.gnome.desktop.interface font-name 'Noto Sans 10'
org.gnome.desktop.interface document-font-name 'Noto Sans 10'
org.gnome.desktop.interface monospace-font-name 'Hack 10'
org.gnome.desktop.interface color-scheme 'prefer-dark'
org.gnome.desktop.interface accent-color 'red'
org.gnome.desktop.wm.preferences button-layout 'icon:minimize,maximize,close'
