# Giao diện mặc định của phiên Hyprland (theme Tokyo Night của hypr/scripts/theme-selector.sh);
# đổi theme trong Hyprland sẽ được lưu vào snapshot riêng của Hyprland.
org.gnome.desktop.interface gtk-theme 'Yaru-blue-dark'
org.gnome.desktop.interface icon-theme 'Papirus-Dark'
org.gnome.desktop.interface cursor-theme 'Banana'
org.gnome.desktop.interface cursor-size 24
org.gnome.desktop.interface font-name 'Ubuntu Sans 11'
org.gnome.desktop.interface document-font-name 'Ubuntu Sans 11'
org.gnome.desktop.interface monospace-font-name 'Ubuntu Sans Mono 11'
org.gnome.desktop.interface color-scheme 'prefer-dark'
org.gnome.desktop.interface accent-color 'blue'
org.gnome.desktop.wm.preferences button-layout ':'
