# swaync là 1 service dùng chung cho sway và Hyprland. Phiên Hyprland (XDG_CURRENT_DESKTOP do
# Hyprland import trước khi restart swaync) dùng style + config riêng ở ~/.config/hypr/apps/swaync
# (không đụng ~/.config/swaync của sway). Không có file đó -> mặc định ~/.config/swaync.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'd="$$HOME/.config/hypr/apps/swaync"; case "$${XDG_CURRENT_DESKTOP:-}" in *Hyprland*) [ -f "$$d/style.css" ] && [ -f "$$d/config.json" ] && exec /usr/bin/swaync -s "$$d/style.css" -c "$$d/config.json" ;; esac; exec /usr/bin/swaync'
