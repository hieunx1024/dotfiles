# swaync 0.12.4 segfault mỗi khi một output biến mất (tắt HDMI, gập máy, đổi chế độ màn hình):
# gtk_native_unrealize / gdk_surface_get_frame_clock trên surface NULL. Mặc định systemd chỉ cho
# restart 5 lần/10s rồi bỏ cuộc -> mất thông báo, notify-send treo ~25s chờ daemon.
# Crash (signal) thì bật lại sau 1s, không giới hạn số lần. Thoát mã 1 ("Failed to open display",
# vd sau khi logout) thì KHÔNG bật lại, tránh vòng lặp mỗi giây khi không có phiên nào.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=1
RestartPreventExitStatus=1
