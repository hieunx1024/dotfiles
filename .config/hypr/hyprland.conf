# =============================================================================
# Hyprland Configuration (0.53.x - cú pháp hyprlang, windowrule dạng block)
# Cấu hình ĐỘC LẬP với sway: không include, không đọc/sửa gì trong ~/.config/sway hay
# ~/.config/waybar. Script dùng chung (volume, night-mode, power-profile...) đã chép riêng
# vào ./scripts, trạng thái lưu ở ~/.local/state/hypr - sửa bên sway không ảnh hưởng Hyprland.
# Kiểm tra cú pháp: Hyprland --verify-config
# =============================================================================

### Variables
$mod = SUPER
$term = kitty
$menu = env PATH=$HOME/.config/hypr/apps/bin:$HOME/.local/bin:/var/lib/flatpak/exports/bin:$PATH XDG_DATA_DIRS=$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:/var/lib/snapd/desktop fuzzel
$browser = MOZ_ENABLE_WAYLAND=1 firefox
$file = nautilus
$hypr = ~/.config/hypr

# Palette hiện tại; được theme-selector.sh thay bằng một trong các file themes/*.conf.
source = ~/.config/hypr/theme.conf

### Monitors
monitor = eDP-1, 1920x1080, 0x0, 1
monitor = HDMI-A-1, 1920x1080@100, auto, 1
monitor = , preferred, auto, 1

### Environment
# GDM không source ~/.profile cho phiên Wayland -> đặt biến môi trường và bộ gõ tại đây.
# Không đặt GTK_IM_MODULE/QT_IM_MODULE: app đi thẳng qua text-input-v3 của compositor.
env = XMODIFIERS,@im=fcitx
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Hỗ trợ ứng dụng Flatpak và Snap
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:/var/lib/snapd/desktop
# kitty/fuzzel/swaync/wlogout/waypaper dùng bản cấu hình RIÊNG của Hyprland (apps/README.md):
# apps/bin đứng đầu PATH để mọi lệnh trong phiên tự dùng cấu hình riêng.
env = KITTY_CONFIG_DIRECTORY,$HOME/.config/hypr/apps/kitty
env = PATH,$HOME/.config/hypr/apps/bin:$HOME/.local/bin:/var/lib/flatpak/exports/bin:$HOME/.local/share/flatpak/exports/bin:$PATH

### Autostart
# Restart các service systemd/dbus sau khi import env: nếu trước đó vào sway (hoặc
# Hyprland vừa crash) mà chưa logout hẳn, chúng vẫn giữ WAYLAND_DISPLAY /
# XDG_CURRENT_DESKTOP cũ -> portal timeout, swaync abort "Only supports Wayland!".
# --no-block: không treo chuỗi exec nếu một backend khởi động chậm.
# Xoá biến IBus mà GNOME để lại (GTK/QT_IM_MODULE=ibus): Hyprland dùng fcitx5 qua text-input, app
# được dbus/systemd khởi động mà nhận biến cũ sẽ tìm IBus (đã tắt) -> không gõ được tiếng Việt.
# (dbus trước rồi mới systemctl unset: dbus đồng bộ ngược sang systemd.)
# theme-selector.sh --apps: sinh file theme của bản app riêng (apps/) TRƯỚC khi restart swaync.
exec-once = $hypr/scripts/theme-selector.sh --apps; dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XMODIFIERS _JAVA_AWT_WM_NONREPARENTING XDG_DATA_DIRS PATH \
    && dbus-update-activation-environment GTK_IM_MODULE= QT_IM_MODULE= IBUS_ENABLE_SYNC_MODE= \
    && systemctl --user unset-environment GTK_IM_MODULE QT_IM_MODULE IBUS_ENABLE_SYNC_MODE \
    && systemctl --user restart --no-block xdg-desktop-portal-gtk xdg-desktop-portal-hyprland xdg-desktop-portal swaync
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = $hypr/scripts/launch-polkit.sh
exec-once = fcitx5 -rd
exec-once = xhost +local:root
exec-once = waypaper --restore
exec-once = $hypr/scripts/statusbar.sh
# Canh phiên: khi Hyprland thoát dọn tiến trình nền + portal/swaync (Ubuntu không tự dọn khi logout)
exec-once = $hypr/scripts/session-exit.sh
# Theme GTK/icon (gsettings) riêng cho phiên Hyprland: đổi theme ở đây không lan sang GNOME/sway
exec-once = ~/.config/session-theme/session-theme.sh hyprland
exec-once = hypridle
exec-once = $hypr/scripts/audio-autoswitch.py
exec-once = $hypr/scripts/scratch-rescue.py
# Plugin overview (Hyprspace / hyprexpo): cấu hình ở hyprspace.conf, nạp bằng plugins.sh
source = ~/.config/hypr/hyprspace.conf
exec = $hypr/scripts/plugins.sh

### Look & Feel
general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    col.active_border = $theme_active_border
    col.inactive_border = $theme_inactive_border
    resize_on_border = true
    layout = dwindle
}

group {
    col.border_active = $theme_active_border
    col.border_inactive = $theme_inactive_border
    col.border_locked_active = $theme_orange
    col.border_locked_inactive = $theme_gray

    groupbar {
        enabled = false
    }
}

decoration {
    rounding = 10
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 3, quick
    animation = windows, 1, 2, quick, popin 90%
    animation = workspaces, 1, 3, quick, slide
    animation = fade, 1, 2, quick
    # Layer (fuzzel, thông báo, waybar): chỉ mờ dần, KHÔNG phóng to - kiểu popin (mặc định) kéo giãn
    # mép menu lúc mở -> dư ảnh / vệt trắng ở cạnh fuzzel. Đường cong smooth: nhanh đầu, chậm cuối.
    bezier = smooth, 0.23, 1, 0.32, 1
    animation = layers, 1, 3, smooth, fade
    animation = fadeLayers, 1, 3, smooth
}

# Luôn giữ gap; chỉ ẩn border khi workspace có đúng một cửa sổ tiled.
windowrule {
    name = no-border-single-tiled
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = false
}

### Input
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = false
        tap-to-click = true
    }
    accel_profile = flat
    sensitivity = 0.82
}

# Khi đang ở trong group/tab, các phím movefocus trái/phải sẽ chuyển tab trước;
# tới đầu/cuối group mới tiếp tục focus sang cửa sổ bên ngoài.
binds {
    movefocus_cycles_groupfirst = true
}

### Touchpad Gestures
gesture = 3, up, dispatcher, exec, $hypr/scripts/overview.sh
gesture = 3, down, dispatcher, exec, $hypr/scripts/overview.sh close
gesture = 3, left, dispatcher, exec, $hypr/scripts/cycle-workspace.py next
gesture = 3, right, dispatcher, exec, $hypr/scripts/cycle-workspace.py prev

### Lid switch (Clamshell khi cắm màn ngoài)
bindl = , switch:on:Lid Switch, exec, $hypr/scripts/clamshell.sh close
bindl = , switch:off:Lid Switch, exec, $hypr/scripts/clamshell.sh open

### Window Rules & Workspace Assignments
windowrule {
    name = ws1-terminal
    match:class = ^(kitty)$
    workspace = 1 silent
}
windowrule {
    name = ws2-ide
    match:class = (?i)(code.*|vscodium.*|cursor.*|jetbrains-(idea|pycharm|webstorm|clion|goland|rustrover|phpstorm|rider|rubymine|studio).*|android-studio.*)
    workspace = 2 silent
}
windowrule {
    name = jetbrains-popups
    match:class = (?i)jetbrains-.*
    match:title = ^(win0|splash|Welcome to .*|Edit .*)$
    float = yes
}
windowrule {
    name = ws3-browser
    match:class = (?i)(firefox|google-chrome|brave-browser|tor browser)
    workspace = 3 silent
}
windowrule {
    name = ws4-ai-chat
    match:class = (?i)(com\.anthropic\.claude|claude|chatgpt|antigravity|org\.telegram\.desktop)
    workspace = 4 silent
}
windowrule {
    name = ws4-claude-code
    match:title = (?i)claude code
    workspace = 4 silent
}
windowrule {
    name = ws5-tools-db
    match:class = (?i)(postman|dbeaver|jetbrains-datagrip|obsidian)
    workspace = 5 silent
}

# fuzzel (namespace "launcher"): không animation khi mở/đóng - mọi kiểu animation layer (popin, cả
# fade) đều để lại dư ảnh/vệt sáng ở menu. Thông báo, waybar vẫn mờ dần như phần animations.
layerrule = no_anim on, match:namespace ^(launcher)$

# Floating helpers
windowrule {
    name = view-launcher
    match:class = ^(view-launcher)$
    float = yes
    center = yes
    border_size = 0
    pin = yes
}
windowrule {
    name = floating-shortcut
    match:class = ^(floating_shortcut)$
    float = yes
    size = 1000 700
    center = yes
}
windowrule {
    name = floating-network
    match:class = ^(floating_network)$
    float = yes
    size = 800 600
    center = yes
}
windowrule {
    name = floating-btop
    match:class = ^(floating_btop)$
    float = yes
    size = 1150 750
    center = yes
}
windowrule {
    name = wl-mirror
    match:class = ^(at\.yrlf\.wl_mirror)$
    float = yes
    border_size = 0
    no_focus = true
}
windowrule {
    name = waypaper
    match:class = ^(waypaper)$
    float = yes
    size = 950 700
    center = yes
}
windowrule {
    name = floating-tools
    match:class = ^(org\.pulseaudio\.pavucontrol|pavucontrol|blueman-manager|nwg-look)$
    float = yes
    size = 800 600
    center = yes
}
windowrule {
    name = floating-media
    match:class = (?i).*(loupe|eog|imv|feh|mpv).*
    float = yes
    size = 1000 700
    center = yes
}

# Gaming
windowrule {
    name = gaming-tile
    match:class = ^(gamescope|steam_app_.*)$
    tile = yes
}

# Mỗi app dùng một special workspace ẩn; Super+- chuyển vòng như Sway.
windowrule {
    name = scratch-discord
    match:class = (?i)(discord|vesktop|webcord)
    float = yes
    size = 1200 800
    center = yes
    workspace = special:discord silent
    suppress_event = activate activatefocus
}
windowrule {
    name = scratch-spotify
    match:class = (?i)spotify
    float = yes
    size = 1200 800
    center = yes
    workspace = special:spotify silent
    suppress_event = activate activatefocus
}
windowrule {
    name = scratch-viber
    match:class = (?i)(viber|viberpc)
    float = yes
    size = 1200 800
    center = yes
    workspace = special:viber silent
    suppress_event = activate activatefocus
}

bind = $mod CTRL, D, exec, $hypr/scripts/scratch-app.sh '(?i)(discord|vesktop|webcord)' discord --toggle
bind = $mod CTRL, S, exec, $hypr/scripts/spotify.sh --toggle
bind = $mod CTRL, V, exec, $hypr/scripts/scratch-app.sh '(?i)viber' viber --toggle

bind = $mod SHIFT, minus, exec, $hypr/scripts/scratch-stash.sh
bind = $mod, minus, exec, $hypr/scripts/scratch-cycle.sh
bind = $mod CTRL, minus, exec, $hypr/scripts/scratch-restore.sh

### Keybindings
# Applications
bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exec, $hypr/scripts/force-kill.sh
bind = $mod, D, exec, $menu
bind = CTRL ALT, space, exec, view-launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $file
bind = $mod, V, exec, $hypr/scripts/clipboard.sh
bind = $mod, I, exec, $term --class floating_shortcut -e nvim -R $hypr/shortcut.md
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod, Tab, exec, $hypr/scripts/overview.sh

# System Controls
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod SHIFT, C, exec, hyprctl reload && (pgrep -x waybar >/dev/null && pkill -USR2 waybar || $hypr/scripts/statusbar.sh)
bind = $mod CTRL, B, exec, pgrep -x waybar >/dev/null && pkill -USR1 waybar || $hypr/scripts/statusbar.sh
bind = $mod SHIFT, B, exec, $hypr/scripts/toggle-mode.sh
bind = $mod SHIFT, T, exec, $hypr/scripts/theme-selector.sh
bind = $mod SHIFT, U, exec, $hypr/scripts/theme-toggle.sh
bind = $mod SHIFT, E, exec, wlogout -l $hypr/apps/wlogout/layout -C $hypr/apps/wlogout/style.css -b 6 -c 20 -r 20 -L 100 -R 100 -T 320 -B 320
bind = $mod CTRL, L, exec, loginctl lock-session
bind = $mod ALT, S, exec, systemctl suspend
bind = $mod SHIFT, P, exec, $hypr/scripts/display-mode.sh

# Focus (hjkl & arrows); H/L và trái/phải ưu tiên chuyển tab trong group
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move windows (hjkl & arrows)
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

bind = $mod CTRL, right, exec, python3 $hypr/scripts/cycle-workspace.py next
bind = $mod CTRL, left, exec, python3 $hypr/scripts/cycle-workspace.py prev

# Layout & Fullscreen
bind = $mod, W, togglegroup,
bind = $mod, X, togglesplit,
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod SHIFT, space, togglefloating,

# Hardware Fn Keys
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, $hypr/scripts/volume_down.sh
bindel = , XF86AudioRaiseVolume, exec, $hypr/scripts/volume_up.sh
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- -n && pkill -RTMIN+1 waybar
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && pkill -RTMIN+1 waybar
bind = $mod SHIFT, N, exec, $hypr/scripts/night-mode.sh
bind = $mod CTRL, N, exec, $hypr/scripts/night-mode.sh --menu
bind = $mod SHIFT, A, exec, $hypr/scripts/toggle_audio.sh

# Screenshots
bind = $mod SHIFT, S, exec, bash -c 'GEOM=$(slurp) && [ -n "$GEOM" ] && grim -g "$GEOM" - | wl-copy'
bind = , Print, exec, grim - | swappy -f -

### Resize submap
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , down, resizeactive, 0 10
binde = , up, resizeactive, 0 -10
binde = , right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
