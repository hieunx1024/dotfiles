# =============================================================================
# Hyprland Configuration (0.53.x - cú pháp hyprlang, windowrule dạng block)
# Cấu hình ĐỘC LẬP với sway: không include, không sửa gì trong ~/.config/sway.
# Chỉ gọi (đọc) vài script không phụ thuộc WM của sway: night-mode, power-profile,
# toggle_audio, audio-autoswitch, volume.
# Kiểm tra cú pháp: Hyprland --verify-config
# =============================================================================

### Variables
$mod = SUPER
$term = kitty
$menu = env PATH=$HOME/.local/bin:$PATH fuzzel
$browser = MOZ_ENABLE_WAYLAND=1 firefox
$file = nautilus
$hypr = ~/.config/hypr
$sway_scripts = ~/.config/sway/scripts

### Monitors
monitor = eDP-1, 1920x1080, 0x0, 1
monitor = HDMI-A-1, 1920x1080@100, auto, 1
monitor = , preferred, auto, 1

### Environment
# GDM không source ~/.profile cho phiên Wayland -> đặt biến bộ gõ tại đây (giống sway-session).
# Không đặt GTK_IM_MODULE/QT_IM_MODULE: app đi thẳng qua text-input-v3 của compositor.
env = XMODIFIERS,@im=fcitx
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

### Autostart
# Restart portal: nếu trước đó đã vào sway mà chưa logout hẳn, portal cũ vẫn giữ
# XDG_CURRENT_DESKTOP=sway -> share màn hình đi nhầm backend wlr.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XMODIFIERS _JAVA_AWT_WM_NONREPARENTING \
    && systemctl --user restart xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec-once = fcitx5 -rd
exec-once = xhost +local:root
exec-once = swaync
exec-once = waypaper --restore
exec-once = waybar -c $hypr/waybar/config.jsonc -s $hypr/waybar/style.css
exec-once = hypridle
exec-once = $sway_scripts/audio-autoswitch.py
# Plugin (hyprexpo...): dùng exec để chạy lại mỗi lần reload, vì reload reset keyword plugin
exec = $hypr/scripts/plugins.sh

### Look & Feel (Monochrome, phẳng như bên sway)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffffff)
    col.inactive_border = rgb(383838)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 3, quick
    animation = windows, 1, 3, quick, popin 90%
    animation = workspaces, 1, 3, quick, slide
    animation = fade, 1, 2, quick
}

# Smart gaps / smart borders: workspace chỉ có 1 cửa sổ thì bỏ gaps và viền
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
}
windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]
    border_size = 0
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
}

### Input
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = false
        tap-to-click = true
    }
    accel_profile = flat
    sensitivity = 0.82
}

gesture = 3, horizontal, workspace

### Lid switch (Clamshell khi cắm màn ngoài)
bindl = , switch:on:Lid Switch, exec, $hypr/scripts/clamshell.sh close
bindl = , switch:off:Lid Switch, exec, $hypr/scripts/clamshell.sh open

### Window Rules & Workspace Assignments
windowrule {
    name = ws1-terminal
    match:class = ^(kitty)$
    workspace = 1 silent
}
windowrule {
    name = ws2-ide
    match:class = (?i)(code|vscodium|cursor|jetbrains)
    workspace = 2 silent
}
windowrule {
    name = jetbrains-popups
    match:class = (?i)jetbrains
    match:title = ^(win0|splash|Welcome to .*|Edit .*)$
    float = yes
}
windowrule {
    name = ws3-browser
    match:class = (?i)(firefox|google-chrome|brave-browser|tor browser)
    workspace = 3 silent
}
windowrule {
    name = ws4-ai-chat
    match:class = (?i)(com\.anthropic\.claude|claude|chatgpt|antigravity|org\.telegram\.desktop)
    workspace = 4 silent
}
windowrule {
    name = ws4-claude-code
    match:title = (?i)claude code
    workspace = 4 silent
}
windowrule {
    name = ws5-notes
    match:class = (?i)obsidian
    workspace = 5 silent
}
windowrule {
    name = ws6-database
    match:class = (?i)(dbeaver|jetbrains-datagrip)
    workspace = 6 silent
}

# Floating helpers
windowrule {
    name = view-launcher
    match:class = ^(view-launcher)$
    float = yes
    center = yes
    border_size = 0
}
windowrule {
    name = floating-shortcut
    match:class = ^(floating_shortcut)$
    float = yes
    size = 1000 700
    center = yes
}
windowrule {
    name = floating-network
    match:class = ^(floating_network)$
    float = yes
    size = 800 600
    center = yes
}
windowrule {
    name = floating-btop
    match:class = ^(floating_btop)$
    float = yes
    size = 1150 750
    center = yes
}
windowrule {
    name = wl-mirror
    match:class = ^(at\.yrlf\.wl_mirror)$
    float = yes
    border_size = 0
    no_focus = true
}

# Gaming
windowrule {
    name = gaming-tile
    match:class = ^(gamescope|steam_app_.*)$
    tile = yes
}

# Scratchpad: mỗi app một special workspace riêng
windowrule {
    name = scratch-discord
    match:class = (?i)(discord|vesktop|webcord)
    float = yes
    size = 1200 800
    center = yes
    workspace = special:discord silent
}
windowrule {
    name = scratch-spotify
    match:class = (?i)spotify
    float = yes
    size = 1200 800
    center = yes
    workspace = special:spotify silent
}
windowrule {
    name = scratch-viber
    match:class = (?i)viber
    float = yes
    size = 1200 800
    center = yes
    workspace = special:viber silent
}

bind = $mod CTRL, D, togglespecialworkspace, discord
bind = $mod CTRL, S, togglespecialworkspace, spotify
bind = $mod CTRL, V, togglespecialworkspace, viber

bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratch
bind = $mod, minus, togglespecialworkspace, scratch
bind = $mod CTRL, minus, exec, hyprctl dispatch movetoworkspace "$(hyprctl activeworkspace -j | jq .id)" && hyprctl dispatch settiled

### Keybindings
# Applications
bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exec, $hypr/scripts/force-kill.sh
bind = $mod, D, exec, $menu
bind = ALT, Z, exec, view-launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $file
bind = $mod, V, exec, $hypr/scripts/clipboard.sh
bind = $mod, I, exec, $term --class floating_shortcut -e nvim -R $hypr/shortcut.md
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod, Tab, exec, $hypr/scripts/overview.sh
bind = $mod SHIFT, Tab, exec, $hypr/scripts/window-switcher.sh

# System Controls
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod CTRL, B, exec, pkill -USR1 waybar
bind = $mod SHIFT, E, exec, wlogout -l $hypr/wlogout/layout -b 6 -c 20 -r 20 -L 100 -R 100 -T 320 -B 320
bind = $mod CTRL, L, exec, loginctl lock-session
bind = $mod ALT, S, exec, systemctl suspend

# Focus (hjkl & arrows)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move windows (hjkl & arrows)
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

bind = $mod CTRL, right, workspace, e+1
bind = $mod CTRL, left, workspace, e-1

# Layout & Fullscreen
bind = $mod, W, togglegroup,
bind = $mod, X, togglesplit,
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod SHIFT, space, togglefloating,

# Hardware Fn Keys
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, $sway_scripts/volume_down.sh
bindel = , XF86AudioRaiseVolume, exec, $sway_scripts/volume_up.sh
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && pkill -RTMIN+1 waybar
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && pkill -RTMIN+1 waybar
bind = $mod SHIFT, N, exec, $sway_scripts/night-mode.sh
bind = $mod CTRL, N, exec, $sway_scripts/night-mode.sh --menu
bind = $mod SHIFT, A, exec, $sway_scripts/toggle_audio.sh

# Screenshots
bind = $mod SHIFT, S, exec, bash -c 'GEOM=$(slurp) && [ -n "$GEOM" ] && grim -g "$GEOM" - | wl-copy'
bind = , Print, exec, grim - | swappy -f -

### Resize submap
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , down, resizeactive, 0 10
binde = , up, resizeactive, 0 -10
binde = , right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
