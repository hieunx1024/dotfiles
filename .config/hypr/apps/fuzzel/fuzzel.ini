# fuzzel của Hyprland (gọi qua apps/bin/fuzzel). Bản riêng: sửa thoải mái, không ảnh hưởng sway.
# icon-theme và màu lấy từ theme.ini (do scripts/theme-selector.sh sinh theo theme đang chọn).
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=kitty
prompt=󰍉 ❯ 
icon-theme=Yaru
icons-enabled=yes
lines=8
width=36
horizontal-pad=16
vertical-pad=12
inner-pad=4
line-height=22
letter-spacing=0
image-size-ratio=0.5
anchor=center
x-margin=0
y-margin=0
exit-on-keyboard-focus-loss=yes
match-mode=fzf

include=~/.config/hypr/apps/fuzzel/theme.ini


[border]
width=2
radius=12
