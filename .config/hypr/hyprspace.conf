# Cấu hình plugin overview. Category plugin {} của Hyprland bỏ qua key lạ, nên plugin
# chưa nạp thì khối này vô hại. Plugin được nạp bởi scripts/plugins.sh.

# Hyprspace (Super+Tab): panel workspace trên mọi màn hình, kéo-thả cửa sổ giữa workspace.
plugin {
    overview {
        panelHeight = 240
        panelBorderWidth = 2
        panelColor = $theme_panel
        panelBorderColor = $theme_inactive_border
        workspaceActiveBackground = $theme_workspace_active
        workspaceInactiveBackground = $theme_workspace_inactive
        workspaceActiveBorder = $theme_active_border
        workspaceInactiveBorder = $theme_inactive_border
        workspaceBorderSize = 2
        workspaceMargin = 12
        centerAligned = true
        showNewWorkspace = false
        showEmptyWorkspace = true
        minWorkspaces = 10
        exitOnSwitch = true
        disableBlur = true
        # Gap do Hyprland quản lý thống nhất; overview không chèn workspace rule runtime.
        overrideGaps = false
    }

    # hyprexpo: Lưới 3x3 toàn màn hình (Exposé)
    hyprexpo {
        columns = 3
        gap_size = 10
        bg_col = rgb(181818)
        # first 1: bắt đầu từ workspace 1 đến 9 tạo lưới 3x3 cân đối
        workspace_method = first 1
        skip_empty = false
    }

    # hyprtasking: Lưới 3x3 toàn màn hình, hỗ trợ kéo thả cửa sổ giữa các workspace
    hyprtasking {
        layout = grid
        gap_size = 12
        border_size = 2
        bg_color = 0x181818ff
        exit_on_hovered = false
        warp_on_move_window = 1
        close_overview_on_reload = true

        drag_button = 0x110   # Chuột trái: kéo-thả cửa sổ giữa các workspace; click để chọn workspace
        select_button = 0x111 # Chuột phải: chọn workspace

        grid {
            rows = 3
            cols = 3
            loop = false
            gaps_use_aspect_ratio = false
        }
    }
}

# Phím Esc thoát overview khi hyprtasking đang bật
bind = , escape, hyprtasking:if_active, hyprtasking:toggle cursor
