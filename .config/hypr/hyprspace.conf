# Cấu hình plugin overview. Category plugin {} của Hyprland bỏ qua key lạ, nên plugin
# chưa nạp thì khối này vô hại. Plugin được nạp bởi scripts/plugins.sh.

# Hyprspace (Super+Tab): panel workspace trên mọi màn hình, kéo-thả cửa sổ giữa workspace.
plugin {
    overview {
        panelHeight = 220
        panelBorderWidth = 2
        panelColor = rgba(141414ee)
        panelBorderColor = rgb(383838)
        workspaceActiveBackground = rgba(ffffff12)
        workspaceInactiveBackground = rgba(00000066)
        workspaceActiveBorder = rgb(ffffff)
        workspaceInactiveBorder = rgb(383838)
        workspaceBorderSize = 2
        workspaceMargin = 12
        centerAligned = true
        showNewWorkspace = true
        showEmptyWorkspace = false
        exitOnSwitch = true
        disableBlur = true
    }

    # hyprexpo: dự phòng khi chưa build Hyprspace (chỉ màn đang focus)
    hyprexpo {
        columns = 3
        gap_size = 6
        bg_col = rgb(141414)
        # m~1 = workspace đầu tiên trên màn đó: không hiện ô trống giả của màn kia
        workspace_method = first m~1
        skip_empty = true
    }
}
